<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Speech Trainer</title>

    <link rel="stylesheet" href="style.css">

    <link rel="manifest" href="manifest.json">

</head>

<body>

    <div id="setupScreen">

        <h1>🎙 Speech Trainer</h1>

        <p class="subtitle">
            Practice speaking, not typing.
        </p>

        <label for="topicInput">
            What do you want to study today?
        </label>

        <textarea
            id="topicInput"
            placeholder="Example:
used to
be used to
get used to
put off"></textarea>

        <label for="countInput">
            Number of sentences
        </label>

        <input
            id="countInput"
            type="number"
            min="5"
            max="100"
            value="20">

        <label for="pauseInput">
            Pause after Russian (seconds)
        </label>

        <input
            id="pauseInput"
            type="number"
            min="1"
            max="15"
            value="5">

        <button id="createBtn">
            Create Training
        </button>

    </div>



    <div id="playerScreen" class="hidden">

        <div id="ruText"></div>

        <div id="enText"></div>

        <div id="controls">

            <button id="prevBtn">
                ⏮ Previous
            </button>

            <button id="pauseBtn">
                ⏸ Pause
            </button>

            <button id="stopBtn">
                ⏹ Stop
            </button>

        </div>

    </div>



   <script src="settings.js"></script> 
<script src="lesson.js"></script>
<script src="speech.js"></script>

<script src="ai.js"></script>

<script src="trainer.js"></script>
<script src="app.js"></script>

</body>

</html>
