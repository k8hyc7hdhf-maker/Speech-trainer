<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Speech Trainer</title>

    <script>
        const VERSION = "0.3";
    </script>

    <script>
        document.write(
            `<link rel="stylesheet" href="style.css?v=${VERSION}">`
        );
    </script>

    <link rel="manifest"
          href="manifest.json">

</head>

<body>

    <div id="setupScreen">

        <h1>🎙 Speech Trainer</h1>

        <p class="version" id="version"></p>

        <script>
            document.getElementById("version").textContent =
                `Version ${VERSION}`;
        </script>

        <p class="subtitle">
            Practice speaking, not typing.
        </p>


        <label for="topicInput">
            What do you want to study today?
        </label>

        <textarea
            id="topicInput"
            placeholder="Example:
used to
be used to
get used to
put off"></textarea>


        <label for="countInput">
            Number of sentences
        </label>

        <input
            id="countInput"
            type="number"
            min="5"
            max="100"
            value="20">


        <label for="pauseInput">
            Pause after Russian (seconds)
        </label>

        <input
            id="pauseInput"
            type="number"
            min="1"
            max="15"
            value="5">


        <button id="createBtn">
            Create Training
        </button>

    </div>


    <div id="playerScreen" class="hidden">

        <div id="ruText"></div>

        <div id="enText"></div>

        <div id="controls">

            <button id="prevBtn">
                ⏮ Previous
            </button>

            <button id="pauseBtn">
                ⏸ Pause
            </button>

            <button id="stopBtn">
                ⏹ Stop
            </button>

        </div>

    </div>


    <script>
        document.write(`
            <script src="settings.js?v=${VERSION}"><\/script>
            <script src="lesson.js?v=${VERSION}"><\/script>
            <script src="speech.js?v=${VERSION}"><\/script>
            <script src="ai.js?v=${VERSION}"><\/script>
            <script src="trainer.js?v=${VERSION}"><\/script>
            <script src="app.js?v=${VERSION}"><\/script>
        `);
    </script>


</body>

</html>
